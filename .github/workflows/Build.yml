name: Build OrangeFox Recovery - tanzanite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Setup Swap
      run: |
        sudo fallocate -l 12G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gperf build-essential libssl-dev libxml2-utils xsltproc \
          unzip fontconfig python3 python-is-python3 repo git \
          bc ccache zip curl libstdc++6 openjdk-11-jdk

    - name: Git Config
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Sync OrangeFox Source
      run: |
        mkdir -p ~/OrangeFox_sync
        cd ~/OrangeFox_sync
        git clone https://gitlab.com/OrangeFox/sync.git sync
        cd sync
        ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

    - name: Clone Tanzanite Recovery Tree
      run: |
        cd ~/fox_12.1
        git clone https://github.com/DVWorkspaces/device_xiaomi_tanzanite_recovery -b fox_12.1 device/xiaomi/tanzanite

    - name: Run Build
      run: |
        cd ~/fox_12.1
        
        # Core Build Flags
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE="Unofficial"
        export LC_ALL="C"
        export TARGET_DEVICE="tanzanite"
        export TW_DEFAULT_LANGUAGE="en"
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        
        set +e
        source build/envsetup.sh
        lunch twrp_tanzanite-eng
        set -e
        
        # Compile direct binaries
        mka bootimage recoveryimage vendorbootimage || mka recoveryimage
        
        # Trigger OrangeFox zip generator script manually
        export FOX_VERSION="R12.0"
        ./vendor/recovery/tools/process_metadata.sh || true
        ./vendor/fox/tools/finalize_zip.sh || true

    - name: Display Output Files
      if: always()
      run: |
        ls -la /home/runner/fox_12.1/out/target/product/tanzanite/ || true
        ls -la /home/runner/fox_12.1/out/target/product/tanzanite/OrangeFox* || true

    - name: Upload Recovery Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: OrangeFox-tanzanite
        path: |
          /home/runner/fox_12.1/out/target/product/tanzanite/*.zip
          /home/runner/fox_12.1/out/target/product/tanzanite/*.img
          
